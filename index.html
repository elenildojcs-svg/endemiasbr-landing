<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EndemiasBr</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f8;
      color: #123;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .box {
      max-width: 700px;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      margin-top: 0;
      color: #0b5c63;
      font-size: 2.2rem;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 24px;
      background: #0b5c63;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
    .btn:hover {
      background: #08464b;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>EndemiasBr</h1>
    <p>
      Plataforma web para apoiar o acompanhamento, a organização e o acesso a informações relacionadas ao trabalho com endemias.
    </p>
    <p>
      O sistema está disponível online e pode ser acessado pelo botão abaixo.
    </p>
    <a class="btn" href="https://endemias.streamlit.app/" target="_blank">
      Acessar sistema
    </a>
  </div>
</body>
</html>
